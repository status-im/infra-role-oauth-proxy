---
- name: 'OAuth Proxy | Validate TLS certificate path'
  assert:
    that:
      - oauth_tls_certs_path is string
      - oauth_tls_certs_path | default('', true) | length > 0
    fail_msg: "'oauth_tls_certs_path' is required when 'oauth_tls_enabled' is true."
  when: oauth_tls_enabled

- name: 'OAuth Proxy | Create directory'
  file:
    path: '{{ oauth_service_path }}'
    state: 'directory'
    recurse: true

- name: 'OAuth Proxy | Create compose file'
  template:
    src: 'docker-compose.yml.j2'
    dest: '{{ oauth_compose_path }}'
    owner: '{{ oauth_service_user }}'
    group: '{{ oauth_service_group }}'
    mode: 0644

- name: 'OAuth Proxy | Create container'
  community.docker.docker_compose_v2:
    project_src: '{{ oauth_service_path }}'
    files: ['{{ oauth_compose_path }}']
    pull: '{{ compose_pull }}'
    state: '{{ compose_state }}'
    recreate: '{{ compose_recreate }}'
  when: not oauth_compose_skip_start
